name: CI/CD — Test, Build, Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cloudpipe

jobs:
  test:
    name: 1. Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd app && npm test

  build:
    name: 2. Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: 3. Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f cloudpipe || true
            docker run -d --name cloudpipe \
              --restart always \
              -p 80:3000 \
              -e APP_VERSION=${{ github.sha }} \
              -e DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              ${{ env.IMAGE }}:${{ github.sha }}
            docker image prune -af
            sleep 5
            curl -fsS http://localhost/health

      - name: Smoke test from the internet
        run: |
          sleep 5
          curl -fsS http://${{ secrets.EC2_HOST }}/health
          echo "Deployed version ${{ github.sha }} is live 🚀"
